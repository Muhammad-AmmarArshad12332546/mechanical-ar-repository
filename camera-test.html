
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Samsung Camera Diagnostic</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.8);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    button {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      z-index: 10;
      border: 0;
      border-radius: 8px;
      background: #1475dd;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div id="status">
    Press Start Camera.
  </div>

  <video id="camera"
         autoplay
         muted
         playsinline>
  </video>

  <button id="start">
    Start Camera
  </button>

  <script>
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const button = document.getElementById("start");

    let stream = null;

    button.addEventListener("click", async () => {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }

        stream = await navigator.mediaDevices
          .getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          });

        video.srcObject = stream;
        await video.play();

        status.textContent =
          "Camera running: " +
          video.videoWidth + " x " +
          video.videoHeight;

        const track = stream.getVideoTracks()[0];

        track.addEventListener("ended", () => {
          status.textContent =
            "Camera stream ended.";
        });

        track.addEventListener("mute", () => {
          status.textContent =
            "Camera stream muted.";
        });

        track.addEventListener("unmute", () => {
          status.textContent =
            "Camera stream resumed.";
        });

      } catch (error) {
        status.textContent =
          "Camera error: " +
          error.name + " - " +
          error.message;
      }
    });
  </script>
</body>
</html>
